<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shopping Cart API — test UI</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --line: #334155;
        --accent: #6366f1;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 920px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      h1 {
        margin: 0 0 0.25rem;
      }
      p.sub {
        color: var(--muted);
        margin: 0 0 1.5rem;
      }
      a {
        color: #a5b4fc;
      }
      .grid {
        display: grid;
        gap: 1.5rem;
        grid-template-columns: 1fr;
      }
      @media (min-width: 760px) {
        .grid {
          grid-template-columns: 340px 1fr;
        }
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1.25rem;
      }
      label {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
        margin: 0.6rem 0 0.25rem;
      }
      input,
      button {
        font: inherit;
      }
      input {
        width: 100%;
        padding: 0.55rem 0.7rem;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #0b1220;
        color: var(--text);
      }
      button {
        cursor: pointer;
        border: none;
        border-radius: 8px;
        padding: 0.55rem 0.9rem;
        font-weight: 600;
      }
      .primary {
        background: var(--accent);
        color: #fff;
        width: 100%;
        margin-top: 1rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 0.5rem;
        border-bottom: 1px solid var(--line);
        font-size: 0.9rem;
      }
      th {
        color: var(--muted);
        font-weight: 600;
      }
      .del {
        background: #7f1d1d;
        color: #fff;
        padding: 0.3rem 0.6rem;
      }
      .empty {
        color: var(--muted);
        padding: 1.5rem 0;
        text-align: center;
      }
      .toast {
        position: fixed;
        bottom: 1rem;
        left: 50%;
        transform: translateX(-50%);
        background: #111827;
        border: 1px solid var(--line);
        padding: 0.6rem 1rem;
        border-radius: 8px;
        opacity: 0;
        transition: 0.2s;
      }
      .toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>🛒 Shopping Cart API</h1>
      <p class="sub">
        Test UI for the products API ·
        <a href="/swagger-ui.html" target="_blank">Swagger UI</a> ·
        <a href="/h2-console" target="_blank">H2 console</a>
      </p>

      <div class="grid">
        <form class="card" id="form">
          <h3 style="margin-top: 0">Add product</h3>
          <label>Name</label><input id="name" required /> <label>Brand</label
          ><input id="brand" /> <label>Price</label
          ><input id="price" type="number" step="0.01" value="0" />
          <label>Inventory</label
          ><input id="inventory" type="number" value="0" />
          <label>Category</label><input id="category" placeholder="e.g. Cues" />
          <label>Description</label><input id="description" />
          <button class="primary" type="submit">Create product</button>
        </form>

        <div class="card">
          <h3 style="margin-top: 0">Products</h3>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Brand</th>
                <th>Price</th>
                <th>Category</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <div class="empty" id="empty" hidden>No products yet.</div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      const API = "/api/products";
      const rows = document.getElementById("rows");
      const empty = document.getElementById("empty");

      function toast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2000);
      }

      async function load() {
        const res = await fetch(API);
        const products = await res.json();
        rows.innerHTML = "";
        empty.hidden = products.length > 0;
        for (const p of products) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${p.id}</td><td></td><td></td><td>$${Number(p.price).toFixed(2)}</td><td></td>
            <td><button class="del">Delete</button></td>`;
          tr.children[1].textContent = p.name ?? "";
          tr.children[2].textContent = p.brand ?? "";
          tr.children[4].textContent = p.category?.name ?? "—";
          tr.querySelector(".del").onclick = () => remove(p.id);
          rows.appendChild(tr);
        }
      }

      async function remove(id) {
        if (!confirm("Delete product " + id + "?")) return;
        await fetch(`${API}/${id}`, { method: "DELETE" });
        toast("Deleted");
        load();
      }

      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const body = {
          name: name.value,
          brand: brand.value,
          price: Number(price.value),
          inventory: Number(inventory.value),
          description: description.value,
          category: category.value,
        };
        const res = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (res.ok) {
          toast("Product created");
          e.target.reset();
          load();
        } else toast("Failed to create");
      });

      load();
    </script>
  </body>
</html>
